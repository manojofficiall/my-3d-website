<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 3D Model Web Viewer</title>

  <!-- Import Google Model Viewer JavaScript -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body body {
  background: #020611;
}

model-viewer {
  background: transparent;
  background-image: url("hub-background.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
    {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }

    model-viewer {
      width: 80vw;
      height: 80vh;
      background-color: #2a2a2a;
      border-radius: 12px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- 3D Model Viewer Tag -->
  <!-- src-la unga .glb file name-a correctly tharavum -->
  <model-viewer 
    src="my_model.glb" 
    alt="3D Model" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    ar>
  </model-viewer>

</body>
</html>
