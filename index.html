
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070c">
  <title>Manoj | 3D Flying Experience</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #05070c;
      color: white;
      font-family: Arial, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: fixed;
      z-index: 2;
      top: 28px;
      left: 32px;
      pointer-events: none;
    }

    .overlay h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 38px);
      letter-spacing: 3px;
    }

    .overlay p {
      color: #8ca9ce;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .back-link {
      position: fixed;
      z-index: 3;
      top: 30px;
      right: 30px;
      padding: 12px 16px;
      color: white;
      text-decoration: none;
      border: 1px solid #3b4d68;
      border-radius: 8px;
      background: rgba(10, 17, 29, .8);
      font-size: 12px;
      letter-spacing: 1px;
    }

    #status {
      position: fixed;
      z-index: 3;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #a6c7f5;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
      white-space: nowrap;
    }

    #error {
      position: fixed;
      z-index: 4;
      left: 20px;
      bottom: 50px;
      color: #ffb3b3;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .overlay {
        top: 20px;
        left: 16px;
      }

      .overlay h1 {
        font-size: 22px;
      }

      .overlay p {
        font-size: 9px;
      }

      .back-link {
        top: 20px;
        right: 12px;
        padding: 10px;
        font-size: 9px;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <canvas id="scene"></canvas>

  <header class="overlay">
    <h1>DEVELOPER HUB</h1>
    <p>FLIGHT SIMULATION EXPERIENCE</p>
  </header>

  <a class="back-link"
     href="https://manojofficiall.github.io/ManojkumarC_portfolio/">
    ← BACK TO PORTFOLIO
  </a>

  <div id="status">INITIALIZING FLIGHT SYSTEM...</div>
  <div id="error" hidden></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.querySelector("#scene");
    const status = document.querySelector("#status");
    const errorBox = document.querySelector("#error");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#05070c");

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 5, 13);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // Lighting
    scene.add(new THREE.HemisphereLight(0xc5e0ff, 0x182033, 2.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3);
    keyLight.position.set(5, 10, 7);
    scene.add(keyLight);

    const blueLight = new THREE.PointLight(0x168cff, 35, 30);
    blueLight.position.set(-5, 3, -4);
    scene.add(blueLight);

    // Circular flight path visual
    const flightRadius = 4.5;
    const flightHeight = 1.4;

    const points = [];
    for (let i = 0; i <= 160; i++) {
      const angle = (i / 160) * Math.PI * 2;
      points.push(new THREE.Vector3(
        Math.cos(angle) * flightRadius,
        flightHeight,
        Math.sin(angle) * flightRadius
      ));
    }

    const pathGeometry = new THREE.BufferGeometry().setFromPoints(points);
    const pathMaterial = new THREE.LineBasicMaterial({
      color: 0x187dff,
      transparent: true,
      opacity: 0.45
    });

    const flightPath = new THREE.LineLoop(pathGeometry, pathMaterial);
    scene.add(flightPath);

    // Subtle ground grid
    const grid = new THREE.GridHelper(40, 40, 0x183456, 0x101c2b);
    grid.position.y = -1.5;
    scene.add(grid);

    // Interactive camera controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 6;
    controls.maxDistance = 24;
    controls.target.set(0, 0.8, 0);

    let plane = null;
    let planeCorrection = new THREE.Group();

    // Load the model
    const loader = new GLTFLoader();

    loader.load(
      "./my_model.glb",

      (gltf) => {
        const model = gltf.scene;

        // Normalize the model size
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const maxDimension = Math.max(size.x, size.y, size.z);
        if (maxDimension > 0) {
          model.scale.setScalar(2.5 / maxDimension);
        }

        // Center the model around its pivot
        model.position.sub(center.multiplyScalar(
          maxDimension > 0 ? 2.5 / maxDimension : 1
        ));

        planeCorrection.add(model);
        plane = new THREE.Group();
        plane.add(planeCorrection);
        scene.add(plane);

        // Adjust if your model faces a different direction.
        // Try Math.PI / 2, -Math.PI / 2, or Math.PI if needed.
        planeCorrection.rotation.y = 0;

        status.textContent = "AIRCRAFT IN FLIGHT · DRAG TO EXPLORE";
      },

      undefined,

      (err) => {
        console.error("Could not load my_model.glb:", err);
        status.textContent = "MODEL LOAD FAILED";
        errorBox.hidden = false;
        errorBox.textContent =
          "Check that my_model.glb exists beside index.html and is named correctly.";
      }
    );

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      if (plane) {
        // Continuous circular flight
        const angle = elapsed * 0.42;

        plane.position.set(
          Math.cos(angle) * flightRadius,
          flightHeight + Math.sin(elapsed * 2.2) * 0.12,
          Math.sin(angle) * flightRadius
        );

        // Face the direction of travel.
        // The offset may need adjustment for your model's orientation.
        plane.rotation.y = -angle;

        // Gentle banking while turning
        plane.rotation.z = -Math.cos(angle) * 0.12;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
