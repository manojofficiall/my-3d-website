
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My 3D Model Web Viewer</title>

    <!-- Google Model Viewer -->
    <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
    </script>

    <style>

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Full Screen Background */
        body {
            background: #020611;
            font-family: Arial, sans-serif;
        }

        /* Full Screen 3D Viewer */
        model-viewer {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            width: 100%;
            height: 100%;

            background-color: transparent;

            background-image: url("hub-background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border: none;
            border-radius: 0;

            box-shadow: none;

            --poster-color: transparent;
        }

        /* Laptop Screen */
        @media (min-width: 1024px) {
            model-viewer {
                width: 100vw;
                height: 100vh;
            }
        }

        /* Tablet */
        @media (max-width: 1023px) {
            model-viewer {
                width: 100%;
                height: 100%;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            model-viewer {
                width: 100vw;
                height: 100vh;
            }
        }
        
/* Full screen airplane path */
.plane-flight {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

/* Airplane movement */
.airplane {
    position: absolute;
    top: 0;
    left: 0;

    font-size: 30px;
    color: #ffffff;

    text-shadow:
        0 0 8px #00aaff,
        0 0 20px #008cff;

    /* Elliptical circular path */
    offset-path: ellipse(33vw 23vh at 50vw 63vh);

    /* Face the direction of flight */
    offset-rotate: auto;

    offset-distance: 0%;

    animation: airplaneFly 12s linear infinite;
}

/* Continuous flying */
@keyframes airplaneFly {
    from {
        offset-distance: 0%;
    }

    to {
        offset-distance: 100%;
    }
}


    </style>
</head>

<body>

    <!-- Full Screen 3D Model -->
    <model-viewer
        src="my_model.glb"
        alt="3D Model"
        camera-controls
        auto-rotate
        rotation-per-second="30deg"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        ar>
    </model-viewer>
    
<div class="plane-flight">
    <div class="airplane">✈</div>
</div>
</body>
</html>
